# SonarQube Cloud (formerly SonarCloud) analysis config — bugs, code smells, duplication,
# maintainability / tech-debt, and coverage import. Free for public repositories. Drives the
# README "quality gate" and "tech debt" badges.
#
# The SonarCloud ORGANIZATION key is `junebug12851` — the owner's ORIGINAL GitHub username. A
# SonarCloud org keeps its key after the GitHub account is renamed (junebug12851 → 1fairyfox), so the
# org and project keys stay junebug12851_*, even though the repo now lives under 1fairyfox on GitHub.
sonar.projectKey=junebug12851_fairyfox-games
sonar.organization=junebug12851
sonar.projectName=fairyfox-games

# ---------------------------------------------------------------------------------------------------
# SCOPE: the games (`games/`) — the pure logic cores (`*.core.js`) plus the shared modules and each
# game's shell. The cores are where a quality / tech-debt gate is most valuable (they carry all the
# real logic and are the only unit-tested code). Tests are declared separately so they don't count as
# analysed product code. The rendering shells (`index.html`, `render.html`) are excluded from the
# analysis — they're canvas glue, exercised by preview, not unit tests.
# ---------------------------------------------------------------------------------------------------
sonar.sources=games
sonar.exclusions=**/index.html,**/render.html,**/*.png,**/*.svg
sonar.tests=games
sonar.test.inclusions=**/*.test.js

# Node-side coverage from the CI run (`npm run test:coverage`, lcov reporter). The same lcov the
# Codecov badge uses is reused here.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js

sonar.sourceEncoding=UTF-8
