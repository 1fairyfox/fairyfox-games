name: SonarCloud

# Deep static analysis via SonarQube Cloud (formerly SonarCloud): bugs, code smells, duplication,
# security hotspots, maintainability / tech-debt, and coverage import. Free for public repos.
# Drives the README "quality gate" and "tech debt" badges.
#
# DORMANT until you enable it: the job only runs when the repo VARIABLE `SONAR_ENABLED` is "true",
# so until then this workflow is a no-op and never shows a spurious red X on a commit or PR.
# One-time setup:
#   1. Sign in at https://sonarcloud.io with GitHub and import 1fairyfox/fairyfox-games
#      (organization `1fairyfox`). Confirm the project key is `1fairyfox_fairyfox-games`
#      (matches sonar-project.properties + the README badge) — adjust both if Sonar differs.
#   2. Add a repo SECRET `SONAR_TOKEN` (Sonar → My Account → Security).
#   3. Add a repo VARIABLE `SONAR_ENABLED` = true
#      (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch: # allow manual runs from the Actions tab / `gh workflow run sonar.yml`

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud scan
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # safety net — a hung sensor fails fast instead of burning runner time
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Sonar wants full history for accurate blame / new-code detection

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Node coverage (lcov, reused by Sonar)
        run: npm run test:coverage

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
